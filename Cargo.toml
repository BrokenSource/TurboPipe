[package]
name        = "turbopipe"
description = "🌀 Fast data piping for python"
repository  = "https://github.com/BrokenSource/TurboPipe"
version     = "2.1.0"
readme      = "readme.md"
license     = "MIT"
edition     = "2024"

[lib]
name = "turbopipe"
path = "turbopipe/lib.rs"
crate-type = ["cdylib"]

[dependencies]
crossbeam-channel = "0.5"
dashmap = "6.2"
libc = "0.2"

[dependencies.pyo3]
version = "0.29"
optional = true
features = [
    "abi3-py311",
    "abi3t",
]

[features]
python = ["dep:pyo3"]

[profile.dev]
strip = true

[profile.release]
overflow-checks = false
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
lto = "fat"
